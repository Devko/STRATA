# Host-side CI: everything that runs without cl6x, the cross toolchain or the emulator.
#
# What does NOT run here, and why: the device build (tools/build.sh) needs the tic6x GCC
# toolchain (~30 min to build) and, for the real figures, TI cl6x, whose installer needs an
# interactive licence click and exists only on Roland's PC. The emulator scenarios
# (tools/scenarios.sh) and every load figure in docs/BUDGET.md depend on that build. Those stay
# manual: see docs/BUILDING.md, "Checks".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run. On main every merge runs to the end, so a red main
# names the merge that made it red instead of the one that cancelled it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-tests:
    name: Host tests (GCC)
    runs-on: ubuntu-24.04
    # A healthy run takes well under a minute. Without a cap a test that never returns holds the job
    # for GitHub's six hours (PR #74's run did, 2026-11-22); the per-test --timeout below names it
    # long before this.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 2      # the merge commit and its base, for the docs-only check

      - name: What changed
        id: changes
        run: tools/ci_changes.sh "${{ github.event_name }}" >> "$GITHUB_OUTPUT"

      # A compiler cache across runs: most PRs touch a few files, so most objects come back from
      # the cache instead of being rebuilt. One cache per job (the two jobs build with different
      # flags); a PR reads main's cache.
      # install: binary takes the action's own ccache release, checked by SHA-256, in a second;
      # apt-get took 5-20 s of a one-minute job (package lists, dpkg triggers, needrestart).
      - name: Compiler cache
        if: steps.changes.outputs.code == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
          max-size: 300M
          install: binary
          # Only main saves (100-170 MB a job): a PR restores main's cache and rebuilds just
          # what it changed, and many open PRs no longer evict main's cache from the 10 GB.
          save: ${{ github.event_name != 'pull_request' }}

      - name: Build and run the suite (shards on every core, 120 s per test)
        if: steps.changes.outputs.code == 'true'
        run: |
          make -C host build -j"$(nproc)" CXX="ccache g++" CC="ccache gcc"
          make -C host test JOBS="$(nproc)" TEST_TIMEOUT=120 CXX="ccache g++" CC="ccache gcc"

      # The ui_layout_* tests are in the suite above; run them again by name so a broken screen
      # shows up as its own failed step instead of one line among thousands.
      - name: Font layout check (every screen)
        if: steps.changes.outputs.code == 'true'
        run: |
          tests=$(build/host/strata-tests --list | grep '^ui_layout_')
          [ -n "$tests" ] || { echo "no ui_layout_ tests found"; exit 1; }
          for t in $tests; do
            echo "== $t"
            build/host/strata-tests --only "$t"
          done

      # The manual's and cheatsheet's screenshots come from ui_screenshots: check its key presses
      # still reach every screen and the PNGs still draw, so tools/screenshots.sh keeps working.
      # It does not compare them with docs/screens/: a UI change redraws them by hand.
      - name: Screenshots still draw
        if: steps.changes.outputs.code == 'true'
        run: |
          dumps="$RUNNER_TEMP/shots"; mkdir -p "$dumps"
          STRATA_SHOTS="$dumps" build/host/strata-tests --only ui_screenshots
          python3 -B tools/screenshots.py "$dumps" "$RUNNER_TEMP/screens"
          python3 -B tools/panel_diagram.py "$RUNNER_TEMP/screens/panel.svg"

      # Insurance on main: the serial run, in registration order, exactly as
      # before sharding. The shards keep that order inside each block, so the two should agree;
      # this is what would show it if they ever stopped doing so.
      - name: Serial run (main only)
        if: steps.changes.outputs.code == 'true' && github.event_name != 'pull_request'
        run: build/host/strata-tests --timeout 120 | tail -1

  sanitizers:
    name: Host tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # BeatRepeat's ring is allocated in init() and never freed, by design (docs/HANDOFF.md).
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 2

      - name: What changed
        id: changes
        run: tools/ci_changes.sh "${{ github.event_name }}" >> "$GITHUB_OUTPUT"

      # The compiler cache, as in host-tests.
      # install: binary takes the action's own ccache release, checked by SHA-256, in a second;
      # apt-get took 5-20 s of a one-minute job (package lists, dpkg triggers, needrestart).
      - name: Compiler cache
        if: steps.changes.outputs.code == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
          max-size: 300M
          install: binary
          # Only main saves (100-170 MB a job): a PR restores main's cache and rebuilds just
          # what it changed, and many open PRs no longer evict main's cache from the 10 GB.
          save: ${{ github.event_name != 'pull_request' }}

      - name: Build and run the suite under ASan and UBSan at -O1 (shards, 300 s per test)
        if: steps.changes.outputs.code == 'true'
        run: |
          make -C host build -j"$(nproc)" SANITIZE=1 ENAGA_BUILD="$RUNNER_TEMP/asan" \
              CXX="ccache g++" CC="ccache gcc"
          make -C host test JOBS="$(nproc)" TEST_TIMEOUT=300 SANITIZE=1 ENAGA_BUILD="$RUNNER_TEMP/asan" \
              CXX="ccache g++" CC="ccache gcc"

  checks:
    name: Repo checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Every command is posted and handled
        run: tools/audit_commands.sh

      - name: CLAUDE.md source rules (core/ without Enaga, no libm or STL, unique filenames)
        run: tools/check_rules.sh

      - name: Enaga pin (local checks, no upstream)
        run: tools/enaga_check.sh

      - name: Release packaging script
        run: python3 -B tests/test_package_release.py

      - name: Release docs script (compat.json, README status, zip names)
        run: python3 -B tests/test_release_docs.py

      - name: Enaga build cache (tools/enaga_cached.py, against a stub Enaga)
        run: python3 -B tests/test_enaga_cached.py

      - name: Scenario harness (full log, lossless turns, object cache, scenario picking, menu rows)
        run: python3 -B tests/test_scenario_tools.py

      - name: Worktree script (tools/wt.sh, against a scratch origin)
        run: bash tests/test_wt.sh

      - name: Card builder (web/, zip code, compat.json, proxy allowlist)
        run: cd web && node --test test/*.test.mjs

      # Most of these run only on Roland's PC (release, scenarios, device build), so this is the
      # one place a syntax slip in them shows before someone needs them.
      - name: Every script in tools/ and tests/ parses
        run: tools/check_scripts.sh
